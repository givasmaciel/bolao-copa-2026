databases:
  - name: bolao-db
    plan: free
    databaseName: bolao
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: bolao-copa-2026
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node database/setup.js && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NOME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bolao-db
          property: connectionString
