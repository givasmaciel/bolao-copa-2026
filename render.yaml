# Blueprint do Render — Bolão Copa 2026
#
# IMPORTANTE: a partir de 28/06/2026 o banco de produção é o Neon
# (PostgreSQL serverless, free tier permanente). Render Postgres não é
# mais provisionado por este blueprint.
#
# A connection string do Neon deve ser configurada manualmente em
# Render Dashboard → bolao-copa-2026 → Environment → DATABASE_URL
# (ela NÃO vem mais de um banco Render interno).

services:
  - type: web
    name: bolao-copa-2026
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node database/setup.js && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NOME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false          # configurar manualmente
      - key: ADMIN_SENHA
        sync: false          # configurar manualmente
      - key: DATABASE_URL
        sync: false          # configurar manualmente com a connection string do Neon
                            # (ex.: postgresql://neondb_owner:...@ep-red-brook-...pooler.us-west-2.aws.neon.tech/neondb?sslmode=require)